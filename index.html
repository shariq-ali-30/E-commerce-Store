<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web/src/bold/style.css">
    <link rel="stylesheet" href="CSS/style.css">
    <title>StyleStore</title>
</head>

<body>

    <div class="navbar">
        <div class="container">

            <div class="left">

                <div class="logo">
                    <i class="ph ph-handbag"></i>
                    <h1>Style<span>Store</span></h1>
                </div>

                <div class="menu">
                    <i class="ph ph-list"></i>
                    <div class="nav-links">
                        <div class="link active"><a href="">Home <span></span></a></div>
                        <div class="link"><a href="">Men <span></span></a></div>
                        <div class="link"><a href="">Women <span></span></a></div>
                        <div class="link"><a href="">Kids <span></span></a></div>
                        <div class="link"><a href="">Contact <span></span></a></div>
                    </div>
                </div>

            </div>

            <div class="right">

                <div class="search-bar">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" placeholder="Search products...">
                </div>

                <div class="btns">
                    <button class="login-btn">Login</button>
                    <button class="signup-btn">Sign Up</button>
                </div>

                <div class="icons">
                    <div class="icon">
                        <span>2</span>
                        <i class="ph ph-shopping-cart"></i>
                    </div>
                    <div class="icon">
                        <span>3</span>
                        <i class="ph ph-heart"></i>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <div class="container">

        <section class="hero-section">

            <img src="images/hero-image.jpg" alt="hero-banner">

            <div class="hero-content">
                <h2>Evelate Your Everyday <span>Style</span></h2>
                <p>Discover the latest trends in fashion and essentials curated just for you. Look good, feel great.</p>
                <div class="btns">
                    <button class="btn-primary">Shop Now</button>
                    <button class="btn-secondary">Explore Collection</button>
                </div>
            </div>
        </section>


    </div>

    <script src="JS/script.js"></script>
</body>

</html>
